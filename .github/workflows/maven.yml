name: Build ShopPlugin

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file ShopPlugin/pom.xml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ShopPlugin
          path: ShopPlugin/target/ShopPlugin.jar
